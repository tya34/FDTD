name: Generate angular FDTD scripts

on:
  push:
    branches:
      - main
    paths:
      - tools/generate_fdtd_angle_scripts.py
      - .github/workflows/generate-fdtd-angle-scripts.yml
      - .github/fdtd-angle-generation.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate scripts
        run: python tools/generate_fdtd_angle_scripts.py

      - name: Validate generated file count
        shell: bash
        run: |
          count=$(find Arch Ring Tube Helix -type f -name '*_FDTD.txt' | wc -l)
          echo "generated_count=$count"
          test "$count" -eq 140

      - name: Commit generated scripts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Arch Ring Tube Helix
          if git diff --cached --quiet; then
            echo "No generated script changes to commit."
          else
            git commit -m "Generate angular FDTD source scripts"
            git push
          fi
