name: Generate FDTD angle scripts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/fdtd-angle-generation.trigger'
      - 'tools/generate_fdtd_angle_scripts.py'
      - '*_FDTD.txt'
      - 'modeling_notes.md'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate angular FDTD scripts
        run: python tools/generate_fdtd_angle_scripts.py
      - name: Commit generated scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Arch Ring Tube Helix Taper
          if git diff --cached --quiet; then
            echo "No generated script changes"
          else
            git commit -m "Regenerate FDTD scripts for source-position longitude"
            git push
          fi
